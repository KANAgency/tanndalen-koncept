<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sajtkoncept — Tänndalen &amp; Orsa Grönklitt</title>
    <link rel="stylesheet" href="/ds/generated/tokens.css" />
    <link rel="stylesheet" href="/ds/generated/fonts-td.css" />
    <link rel="stylesheet" href="/ds/generated/fonts-og.css" />
    <style>
      :root {
        --sv-bg: #1c1e20;
        --sv-ink: #f2efec;
        --sv-muted: rgba(242, 239, 236, 0.62);
        --sv-line: rgba(242, 239, 236, 0.14);
        --sv-ui: "CircularXX TT", system-ui, sans-serif;
        --phone-w: 393px;
        --phone-h: 852px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--sv-bg);
        color: var(--sv-ink);
        font-family: var(--sv-ui);
        font-weight: 450;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }

      /* ---------- Väljaren ---------- */
      .sv {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 24px;
        padding: 32px 40px;
      }
      .sv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
      .sv-head h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
      .sv-head p, .sv-foot { margin: 0; font-size: 13px; color: var(--sv-muted); }
      .sv-sites { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
      .sv-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 520px;
        padding: 32px;
        border-radius: 16px;
        overflow: hidden;
        isolation: isolate;
        background: #2a2d30;
      }
      .sv-card > img.sv-photo {
        position: absolute; inset: 0; z-index: -2;
        width: 100%; height: 100%; object-fit: cover;
        transform: scale(1.02);
        transition: transform 900ms cubic-bezier(.2,.7,.2,1);
      }
      .sv-card::after {
        content: ""; position: absolute; inset: 0; z-index: -1;
        background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 38%, rgba(0,0,0,.08) 55%, rgba(0,0,0,.62) 100%);
      }
      .sv-card:hover > img.sv-photo { transform: scale(1.06); }
      .sv-logo { height: 40px; width: auto; align-self: flex-start; }
      .sv-card[data-site="og"] .sv-logo { height: 64px; }
      .sv-body { display: flex; flex-direction: column; gap: 20px; }
      .sv-tagline { margin: 0; max-width: 26ch; font-size: 28px; line-height: 1.15; }
      .sv-card[data-site="td"] .sv-tagline { font-family: "Superclarendon", Georgia, serif; font-weight: 400; }
      .sv-card[data-site="og"] .sv-tagline { font-family: "Literata", Georgia, serif; font-weight: 500; }
      .sv-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .sv-btn {
        display: inline-flex; align-items: center; gap: 8px;
        height: 48px; padding: 0 20px;
        border-radius: 999px;
        font-size: 15px; font-weight: 700; text-decoration: none;
        transition: background-color 160ms, color 160ms, border-color 160ms;
      }
      .sv-btn svg { width: 18px; height: 18px; flex: none; }
      .sv-btn-primary { background: var(--sv-ink); color: #1c1e20; }
      .sv-btn-primary:hover { background: #fff; }
      .sv-btn-ghost { color: var(--sv-ink); border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .sv-btn-ghost:hover { border-color: #fff; background: rgba(0,0,0,.32); }
      .sv-btn:focus-visible, .pv-bar a:focus-visible, .pv-bar button:focus-visible { outline: 2px solid var(--sv-ink); outline-offset: 3px; }
      .sv-foot { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
      .sv-foot code { font-family: ui-monospace, monospace; font-size: 12px; }

      @media (max-width: 1023px) {
        .sv { padding: 24px 16px; gap: 16px; }
        .sv-sites { grid-template-columns: 1fr; }
        .sv-card { min-height: 440px; padding: 24px; }
        .sv-tagline { font-size: 24px; }
        .sv-head p { display: none; }
      }

      /* ---------- Mobilförhandsvisning (?mobil=td|og) ---------- */
      .pv { display: none; }
      body.is-preview .sv { display: none; }
      body.is-preview .pv {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh; height: 100dvh;
      }
      .pv-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--sv-line);
        font-size: 14px;
      }
      .pv-bar a, .pv-bar button { color: inherit; text-decoration: none; font: inherit; }
      .pv-back { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
      .pv-back svg { width: 16px; height: 16px; }
      .pv-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); }
      .pv-seg a { padding: 6px 14px; border-radius: 999px; color: var(--sv-muted); }
      .pv-seg a[aria-current="page"] { background: var(--sv-ink); color: #1c1e20; font-weight: 700; }
      .pv-tools { display: flex; align-items: center; gap: 20px; }
      .pv-tools a, .pv-tools button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--sv-muted); }
      .pv-tools a:hover, .pv-tools button:hover { color: var(--sv-ink); }
      .pv-tools .pv-size { color: var(--sv-muted); font-variant-numeric: tabular-nums; }
      .pv-stage { position: relative; overflow: hidden; }
      .pv-device {
        width: calc(var(--phone-w) + 24px);
        height: calc(var(--phone-h) + 24px);
        padding: 12px;
        border-radius: 56px;
        background: #0c0d0e;
        box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 40px 80px rgba(0,0,0,.45);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
      }
      .pv-device iframe {
        display: block; width: var(--phone-w); height: var(--phone-h);
        border: 0; border-radius: 44px; background: #fff;
      }
      @media (max-width: 640px) {
        .pv-bar { padding: 10px 16px; }
        .pv-tools .pv-size, .pv-back span { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="sv">
      <header class="sv-head">
        <h1>Sajtkoncept</h1>
        <p>Kundprototyp · KAN</p>
      </header>

      <div class="sv-sites">
        <article class="sv-card" data-site="td">
          <img class="sv-photo" src="/td/assets/img/brand/td-brand-3.jpg" alt="" />
          <img class="sv-logo" src="/td/assets/brand/logo-horizontal-white.svg" alt="Tänndalen" />
          <div class="sv-body">
            <p class="sv-tagline">Älskat av skidåkare.</p>
            <div class="sv-actions">
              <a class="sv-btn sv-btn-primary" href="/td/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
                Desktop
              </a>
              <a class="sv-btn sv-btn-ghost" href="?mobil=td" data-mobile="td">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
                Mobil
              </a>
            </div>
          </div>
        </article>

        <article class="sv-card" data-site="og">
          <img class="sv-photo" src="/og/assets/img/og-hero-winter.jpg" alt="" />
          <img class="sv-logo" src="/og/assets/brand/logo-vertical-white.svg" alt="Orsa Grönklitt" />
          <div class="sv-body">
            <p class="sv-tagline">Familjeresmålet fyra timmar från Stockholm.</p>
            <div class="sv-actions">
              <a class="sv-btn sv-btn-primary" href="/og/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
                Desktop
              </a>
              <a class="sv-btn sv-btn-ghost" href="?mobil=og" data-mobile="og">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
                Mobil
              </a>
            </div>
          </div>
        </article>
      </div>

      <footer class="sv-foot">
        <span>Mobil visar sajten i 393 × 852 px. På en telefon öppnas den direkt.</span>
        <span>Tips: <code>?plats=1</code> = På plats</span>
      </footer>
    </main>

    <section class="pv" aria-label="Mobilförhandsvisning">
      <nav class="pv-bar">
        <a class="pv-back" href="./">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 8H2M6.8 3.2 2 8l4.8 4.8"/></svg>
          <span>Sajtväljare</span>
        </a>
        <div class="pv-seg" role="group" aria-label="Sajt">
          <a href="?mobil=td" data-site="td">Tänndalen</a>
          <a href="?mobil=og" data-site="og">Orsa Grönklitt</a>
        </div>
        <div class="pv-tools">
          <span class="pv-size">393 × 852</span>
          <button type="button" id="pv-reload">Ladda om</button>
          <a id="pv-open" href="/td/" target="_blank" rel="noopener">Öppna ↗</a>
        </div>
      </nav>
      <div class="pv-stage" id="pv-stage">
        <div class="pv-device" id="pv-device"><iframe id="pv-frame" title="Mobilvy"></iframe></div>
      </div>
    </section>

    <script>
      (() => {
        const SITES = { td: "/td/", og: "/og/" };
        const phoneLike = () => matchMedia("(max-width: 640px) and (pointer: coarse)").matches;

        // På en riktig telefon: Mobil = öppna sajten direkt, ingen ram.
        document.querySelectorAll("[data-mobile]").forEach((link) => {
          link.addEventListener("click", (event) => {
            if (!phoneLike()) return;
            event.preventDefault();
            location.href = SITES[link.dataset.mobile];
          });
        });

        const params = new URLSearchParams(location.search);
        const site = params.get("mobil");
        if (!SITES[site]) return;
        if (phoneLike()) { location.replace(SITES[site]); return; }

        const extra = new URLSearchParams(params);
        extra.delete("mobil");
        const query = extra.toString();
        const src = SITES[site] + (query ? `?${query}` : "");
        document.body.classList.add("is-preview");
        document.title = `Mobil · ${site === "td" ? "Tänndalen" : "Orsa Grönklitt"} — Sajtkoncept`;
        const frame = document.getElementById("pv-frame");
        frame.src = src;
        document.getElementById("pv-open").href = src;
        document.querySelectorAll(".pv-seg a").forEach((a) => {
          if (a.dataset.site === site) a.setAttribute("aria-current", "page");
          if (query) a.href = `?mobil=${a.dataset.site}&${query}`;
        });
        document.getElementById("pv-reload").addEventListener("click", () => frame.contentWindow.location.reload());

        const stage = document.getElementById("pv-stage");
        const device = document.getElementById("pv-device");
        function fit() {
          const pad = 48;
          const s = Math.min(1, (stage.clientHeight - pad) / device.offsetHeight, (stage.clientWidth - pad) / device.offsetWidth);
          device.style.transform = `translate(-50%, -50%) scale(${s})`;
        }
        fit();
        addEventListener("resize", fit);
      })();
    </script>
  </body>
</html>
