name: Deploy prototype (Azure Static Web Apps)

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sajtkoncept
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Hub: sidväljare på / plus /td/ och /og/ (samma URL:er som lokal dev-server).
      # TD-videor ligger i Cloudflare R2 (bucket td-video, prefix td/); bygget pekar om assets/video/ dit.
      - name: Build hub dist
        env:
          TD_VIDEO_BASE: https://pub-4e0fd720b7c94611ae98332f7f97e772.r2.dev
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: sajtkoncept/dist
          skip_app_build: true
